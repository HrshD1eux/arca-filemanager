name: 💡 Feature Request
description: Suggest an idea, enhancement, or new feature for ARCA File Manager.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature to make ARCA File Manager better! Please keep in mind that ARCA is strictly an offline-first, bloat-free, privacy-preserving utility.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation in your workflow?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or new capability you would like added.
      placeholder: "Add an option to..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions Considered
      description: Describe any alternative solutions or features you've considered.
      placeholder: "I considered using..."

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any screenshots, mockups, or examples that help explain your idea.

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues and discussions to ensure this feature hasn't already been proposed.
          required: true
        - label: This feature aligns with ARCA's offline-first, privacy-respecting philosophy (no tracking, no bloat).
          required: true
