name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Release Tag (e.g. v1.6.0 - defaults to tag or versionName)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build, Sign & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > keystore/release.jks
            echo "Release keystore decoded from KEYSTORE_BASE64 secret."
          elif [ -f keystore/release.jks ]; then
            echo "Release keystore already present on runner."
          else
            echo "KEYSTORE_BASE64 secret is not configured. Generating release signing keystore..."
            keytool -genkeypair -v \
              -keystore keystore/release.jks \
              -alias arca_release \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass arca_release_vault_2026 \
              -keypass arca_release_vault_2026 \
              -dname "CN=ARCA File Manager, OU=Mobile, O=ARCA Open Source, L=Global, ST=Global, C=US"
            echo "Release keystore generated successfully."
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare Release Artifacts & Generate Checksums
        id: prep
        run: |
          # 1. Determine version name and release tag
          VERSION_NAME=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -1 | cut -d '"' -f 2)
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.0.0"
          fi

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            RELEASE_TAG="${{ inputs.release_tag }}"
          else
            RELEASE_TAG="v${VERSION_NAME}"
          fi

          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

          # 2. Package artifacts
          mkdir -p release-artifacts
          SOURCE_APK="app/build/outputs/apk/release/app-release.apk"
          TARGET_APK="release-artifacts/arca-filemanager-${RELEASE_TAG}.apk"

          if [ -f "$SOURCE_APK" ]; then
            cp "$SOURCE_APK" "$TARGET_APK"
            cd release-artifacts
            sha256sum "arca-filemanager-${RELEASE_TAG}.apk" > "arca-filemanager-${RELEASE_TAG}.apk.sha256"
            sha256sum "arca-filemanager-${RELEASE_TAG}.apk" > checksums.txt
            cd ..
            echo "Artifact prepared: $TARGET_APK"
          else
            echo "Error: Release APK not found at $SOURCE_APK" >&2
            exit 1
          fi

      - name: Upload Artifacts to Actions Tab
        uses: actions/upload-artifact@v4
        with:
          name: arca-release-apk-${{ steps.prep.outputs.release_tag }}
          path: release-artifacts/*
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_release == true) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.release_tag }}
          name: "ARCA File Manager ${{ steps.prep.outputs.release_tag }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release-artifacts/*.apk
            release-artifacts/*.sha256
            release-artifacts/checksums.txt
